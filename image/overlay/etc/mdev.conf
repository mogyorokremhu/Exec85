# <name regex>  <user:group>  <mode>   (applied by mdev at boot and on hot-plug)
# Normal users in the "input" and "video" groups can use the keyboard and the screen;
# nothing else on the system is opened up.
null            root:root   666
zero            root:root   666
full            root:root   666
random          root:root   666
urandom         root:root   444
tty             root:tty    666
tty[0-9]*       root:tty    660
ptmx            root:tty    666
console         root:tty    600
input/.*        root:input  660
dri/.*          root:video  660
fb[0-9]*        root:video  660
sd[a-z].*       root:disk   660
vd[a-z].*       root:disk   660
nvme.*          root:disk   660
sr[0-9]*        root:cdrom  660
