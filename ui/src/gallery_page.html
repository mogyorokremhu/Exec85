<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Photo gallery</title>
<style>
  :root { --bg:#0b1d2a; --panel:#102838; --bar:#1f3b4d; --text:#d9ecf7; --dim:#7fa3b8; --accent:#f2b84b; --err:#ff8a7a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
  #login { margin: 12vh auto 0; width: min(92vw, 360px); padding: 24px; background: var(--panel); border: 2px solid var(--bar); }
  #login h1 { margin: 0 0 14px; font-size: 22px; color: var(--accent); }
  input[type=password] { width: 100%; padding: 10px; font: inherit; color: var(--text); background: var(--bg); border: 2px solid var(--bar); border-radius: 0; }
  button { font: inherit; color: var(--text); background: var(--bar); border: 2px solid #35566b; padding: 8px 14px; border-radius: 0; cursor: pointer; touch-action: manipulation; }
  button:active { background: var(--accent); color: #102838; }
  #login button { width: 100%; margin-top: 14px; padding: 12px; }
  #err { min-height: 1.4em; margin-top: 10px; color: var(--err); font-size: 14px; }
  #app { display: none; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; background: var(--panel); border-bottom: 2px solid var(--bar); }
  #crumbs { flex: 1; min-width: 40%; font-size: 15px; word-break: break-all; }
  #crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
  #crumbs a:hover { text-decoration: underline; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; padding: 10px; }
  .tile { position: relative; aspect-ratio: 1; background: var(--panel); border: 1px solid var(--bar); overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .tile img, .tile video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .tile .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 6px; font-size: 12px; background: rgba(0,0,0,.6); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tile.dir { flex-direction: column; font-size: 42px; color: var(--accent); }
  .tile.dir .label { position: static; background: none; font-size: 14px; color: var(--text); padding: 6px; }
  .play { position: absolute; font-size: 34px; text-shadow: 0 0 6px #000; pointer-events: none; }
  #empty { padding: 30px; color: var(--dim); text-align: center; }
  #lb { position: fixed; inset: 0; display: none; background: rgba(0,0,0,.94); z-index: 5; align-items: center; justify-content: center; touch-action: pan-y; }
  #lb img, #lb video { max-width: 100vw; max-height: 100vh; object-fit: contain; }
  #lb .bar { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 8px; padding: 10px; justify-content: space-between; align-items: center; background: linear-gradient(rgba(0,0,0,.7), transparent); }
  #lb .nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 30px; padding: 14px 10px; background: rgba(0,0,0,.4); border: none; }
  #prev { left: 0; } #next { right: 0; }
  #msg { padding: 6px 12px; color: var(--dim); font-size: 14px; white-space: pre-wrap; }
  progress { width: 100%; height: 10px; }
</style>
</head>
<body>
<form id="login">
  <h1>Photo gallery</h1>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
  <button type="submit" id="go">Open</button>
  <div id="err" role="alert"></div>
</form>

<div id="app">
  <header>
    <div id="crumbs"></div>
    <button id="upbtn" hidden>Add</button>
    <input id="upfile" type="file" accept="image/*,video/*" multiple hidden>
    <button id="out">Log out</button>
  </header>
  <div id="msg"></div>
  <div id="grid"></div>
  <div id="empty" hidden>Nothing here yet.</div>
</div>

<div id="lb">
  <div class="bar"><span id="cap"></span><span><a id="dl" style="color:var(--accent)" download>Save</a> &nbsp; <button id="close">&#10005;</button></span></div>
  <button class="nav" id="prev">&#10094;</button>
  <div id="stage"></div>
  <button class="nav" id="next">&#10095;</button>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const H = { "X-Exec85": "1" };
let dir = "", items = [], media = [], cur = -1, canUpload = false;

function say(t) { $("msg").textContent = t || ""; }
const enc = p => p.split("/").filter(Boolean).map(encodeURIComponent).join("/");
const url = name => "/media/" + enc((dir ? dir + "/" : "") + name);

$("login").addEventListener("submit", async ev => {
  ev.preventDefault(); $("err").textContent = ""; $("go").disabled = true;
  try {
    const r = await fetch("/api/login", { method: "POST", headers: Object.assign({ "Content-Type": "application/x-www-form-urlencoded" }, H), credentials: "same-origin", body: "pass=" + encodeURIComponent($("pw").value) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { $("pw").value = ""; show(); } else $("err").textContent = j.error || "Could not log in";
  } catch (e) { $("err").textContent = "Cannot reach the gallery."; }
  $("go").disabled = false;
});

function show() { $("login").style.display = "none"; $("app").style.display = "block"; load(""); }

async function load(d) {
  const r = await fetch("/api/list?dir=" + encodeURIComponent(d), { credentials: "same-origin" });
  if (r.status === 401) { $("app").style.display = "none"; $("login").style.display = "block"; $("err").textContent = "Please log in again."; return; }
  const j = await r.json().catch(() => null);
  if (!j || !j.ok) { say((j && j.error) || "Could not open that folder"); return; }
  dir = j.dir; items = j.items; canUpload = j.uploads; say("");
  media = items.filter(i => i.k !== "dir");
  crumbs(); grid();
  $("upbtn").hidden = !canUpload;
}

function crumbs() {
  const c = $("crumbs"); c.textContent = "";
  const root = document.createElement("a"); root.textContent = "Gallery"; root.onclick = () => load(""); c.appendChild(root);
  let acc = "";
  for (const part of dir.split("/").filter(Boolean)) {
    acc += (acc ? "/" : "") + part;
    const a = document.createElement("a"); const target = acc; a.textContent = part; a.onclick = () => load(target);
    c.appendChild(document.createTextNode(" / ")); c.appendChild(a);
  }
}

function grid() {
  const g = $("grid"); g.textContent = "";
  items.forEach(it => {
    const t = document.createElement("div"); t.className = "tile" + (it.k === "dir" ? " dir" : "");
    const label = document.createElement("div"); label.className = "label"; label.textContent = it.n;
    if (it.k === "dir") { const ic = document.createElement("div"); ic.textContent = "📁"; t.appendChild(ic); t.appendChild(label); t.onclick = () => load((dir ? dir + "/" : "") + it.n); }
    else if (it.k === "image") { const im = document.createElement("img"); im.loading = "lazy"; im.decoding = "async"; im.alt = it.n; im.src = url(it.n); t.appendChild(im); t.appendChild(label); t.onclick = () => open(media.indexOf(it)); }
    else { const v = document.createElement("video"); v.preload = "metadata"; v.muted = true; v.src = url(it.n) + "#t=0.1"; t.appendChild(v); const p = document.createElement("div"); p.className = "play"; p.textContent = "▶"; t.appendChild(p); t.appendChild(label); t.onclick = () => open(media.indexOf(it)); }
    g.appendChild(t);
  });
  $("empty").hidden = items.length > 0;
}

function open(i) {
  if (i < 0 || i >= media.length) return;
  cur = i; const it = media[i];
  const st = $("stage"); st.textContent = "";
  let el;
  if (it.k === "image") { el = document.createElement("img"); el.alt = it.n; el.src = url(it.n); }
  else { el = document.createElement("video"); el.controls = true; el.autoplay = true; el.playsInline = true; el.src = url(it.n); }
  st.appendChild(el);
  $("cap").textContent = it.n + "  (" + (i + 1) + " / " + media.length + ")";
  $("dl").href = url(it.n); $("dl").setAttribute("download", it.n);
  $("lb").style.display = "flex";
}
function closeLb() { $("lb").style.display = "none"; $("stage").textContent = ""; cur = -1; }
function step(d) { if (cur < 0) return; const n = cur + d; if (n >= 0 && n < media.length) open(n); }
$("close").onclick = closeLb; $("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
document.addEventListener("keydown", ev => {
  if ($("lb").style.display !== "flex") return;
  if (ev.key === "Escape") closeLb(); else if (ev.key === "ArrowLeft") step(-1); else if (ev.key === "ArrowRight") step(1);
});
let sx = null;
$("lb").addEventListener("touchstart", e => { sx = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
$("lb").addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 70) step(dx < 0 ? 1 : -1); }, { passive: true });

$("out").onclick = async () => { await fetch("/api/logout", { method: "POST", headers: H, credentials: "same-origin" }).catch(() => null); $("app").style.display = "none"; $("login").style.display = "block"; };

// adding pictures and videos (only when the owner has switched it on)
$("upbtn").onclick = () => $("upfile").click();
$("upfile").onchange = async () => {
  const files = [...$("upfile").files]; $("upfile").value = "";
  const lines = [];
  for (const f of files) {
    lines.push(await new Promise(res => {
      const x = new XMLHttpRequest();
      x.open("POST", "/api/upload?dir=" + encodeURIComponent(dir) + "&name=" + encodeURIComponent(f.name));
      x.setRequestHeader("X-Exec85", "1");
      x.upload.onprogress = e => { if (e.lengthComputable) say("Sending " + f.name + " ... " + Math.round(100 * e.loaded / e.total) + "%"); };
      x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch (e) { } res(j.ok ? "Added " + j.name : (j.error || "Failed") + " (" + f.name + ")"); };
      x.onerror = () => res("Failed (" + f.name + ")");
      x.send(f);
    }));
    say(lines.join("\n"));
  }
  load(dir);
};

fetch("/api/list?dir=", { credentials: "same-origin" }).then(r => { if (r.ok) show(); }).catch(() => null);
</script>
</body>
</html>
