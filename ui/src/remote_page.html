<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Exec85 remote</title>
<style>
  :root { --bg:#0b1d2a; --panel:#102838; --bar:#1f3b4d; --text:#d9ecf7; --dim:#7fa3b8; --accent:#f2b84b; --err:#ff8a7a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; overscroll-behavior: none; }
  #login { margin: auto; width: min(92vw, 380px); padding: 24px; background: var(--panel); border: 2px solid var(--bar); }
  #login h1 { margin: 0 0 4px; font-size: 22px; color: var(--accent); }
  #login p { margin: 0 0 16px; color: var(--dim); font-size: 14px; }
  label { display: block; margin: 10px 0 4px; color: var(--dim); font-size: 14px; }
  input[type=text], input[type=password] { width: 100%; padding: 10px; font: inherit; color: var(--text); background: var(--bg); border: 2px solid var(--bar); border-radius: 0; }
  button { font: inherit; color: var(--text); background: var(--bar); border: 2px solid #35566b; padding: 8px 12px; border-radius: 0; cursor: pointer; touch-action: manipulation; }
  button:active, button.on { background: var(--accent); color: #102838; }
  #login button { width: 100%; margin-top: 16px; padding: 12px; }
  #err { min-height: 1.4em; margin-top: 12px; color: var(--err); font-size: 14px; }
  #screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  canvas { max-width: 100%; max-height: 100%; image-rendering: pixelated; outline: none; background: var(--bg); }
  #bar { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--panel); border-top: 2px solid var(--bar); padding-bottom: max(4px, env(safe-area-inset-bottom)); }
  #bar button { padding: 8px 10px; min-width: 40px; }
  #bar .sp { flex: 1; }
  #hidekeys { display: none; }
  #kb { position: fixed; left: -100px; top: 0; width: 10px; height: 10px; opacity: 0; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.7); z-index: 5; padding: 16px; }
  #overlay .box { width: min(94vw, 460px); background: var(--panel); border: 2px solid var(--bar); padding: 18px; max-height: 92vh; overflow: auto; }
  #overlay h2 { margin: 0 0 12px; font-size: 18px; color: var(--accent); }
  #overlay .row { display: flex; gap: 6px; margin: 6px 0; }
  #overlay .row input { flex: 1; }
  #msg { margin-top: 10px; color: var(--dim); font-size: 14px; word-break: break-all; }
  #drop { display: none; position: fixed; inset: 0; z-index: 6; background: rgba(242,184,75,.25); border: 4px dashed var(--accent); align-items: center; justify-content: center; font-size: 22px; pointer-events: none; }
  progress { width: 100%; height: 14px; }
</style>
</head>
<body>
<form id="login" autocomplete="on">
  <h1>Exec85</h1>
  <p id="host">Log in with your Exec85 user name and password.</p>
  <label for="u">User name</label>
  <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit" id="go">Log in</button>
  <div id="err" role="alert"></div>
</form>

<div id="screen">
  <div id="stage"><canvas id="cv" tabindex="0" width="640" height="400"></canvas></div>
  <div id="bar">
    <button data-k="esc">Esc</button>
    <button data-k="tab">Tab</button>
    <button data-k="alt-a">Apps</button>
    <button data-k="f10">Menu</button>
    <button data-k="f4">Close</button>
    <button data-k="f6">Next</button>
    <button data-k="up">&#9650;</button>
    <button data-k="down">&#9660;</button>
    <button data-k="left">&#9664;</button>
    <button data-k="right">&#9654;</button>
    <button data-k="enter">Enter</button>
    <button data-k="backspace">&#9003;</button>
    <button data-k="delete">Del</button>
    <button data-k="pgup">PgUp</button>
    <button data-k="pgdn">PgDn</button>
    <button id="mctrl">Ctrl</button>
    <button id="malt">Alt</button>
    <button id="mkbd">Keyboard</button>
    <span class="sp"></span>
    <button id="mfiles">Files</button>
    <button id="mout">Log out</button>
  </div>
</div>
<input id="kb" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="keyboard">

<div id="overlay"><div class="box" id="ob"></div></div>
<div id="drop">Drop files to send them to the server</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const H = { "X-Exec85": "1" };
let me = null, W = 0, H2 = 0, ctx = null, img = null, aborter = null, running = false;
let stickyCtrl = false, stickyAlt = false, queue = [], sending = false;

function say(el, text) { el.textContent = text; }

async function api(path, opt) {
  opt = opt || {};
  opt.headers = Object.assign({}, H, opt.headers || {});
  opt.credentials = "same-origin";
  return fetch(path, opt);
}

$("login").addEventListener("submit", async ev => {
  ev.preventDefault();
  say($("err"), "");
  $("go").disabled = true;
  try {
    const r = await api("/api/login", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "user=" + encodeURIComponent($("u").value) + "&pass=" + encodeURIComponent($("p").value) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { me = j; $("p").value = ""; showScreen(); }
    else say($("err"), j.error || "Login failed");
  } catch (e) { say($("err"), "Cannot reach the server."); }
  $("go").disabled = false;
});

function showScreen() {
  $("login").style.display = "none";
  $("screen").style.display = "flex";
  closeOverlay();
  startStream();
}

function showLogin(text) {
  running = false;
  if (aborter) aborter.abort();
  $("screen").style.display = "none";
  $("login").style.display = "block";
  say($("err"), text || "");
  $("u").focus();
}

// ---- the picture ----

function wantedSize() {
  const stage = $("stage");
  const cw = Math.max(320, stage.clientWidth || innerWidth), ch = Math.max(200, stage.clientHeight || innerHeight - 60);
  const w = Math.max(640, Math.min(1280, cw));          // wide screens get a sharper picture, phones a picture that scales down
  const h = Math.max(360, Math.min(1000, Math.round(w * ch / cw)));
  return [w - (w % 4), h - (h % 4)];
}

function drawTiles(p) {
  const dv = new DataView(p.buffer, p.byteOffset, p.byteLength);
  const w = dv.getUint16(0, true), h = dv.getUint16(2, true), n = dv.getUint16(4, true);
  const cv = $("cv");
  if (w !== W || h !== H2 || !img) {
    W = w; H2 = h; cv.width = w; cv.height = h;
    ctx = cv.getContext("2d");
    img = ctx.createImageData(w, h);
  }
  const d = img.data;
  let i = 6;
  for (let t = 0; t < n; t++) {
    const x0 = dv.getUint16(i, true), y0 = dv.getUint16(i + 2, true), runs = dv.getUint16(i + 4, true);
    i += 6;
    const x1 = Math.min(x0 + 64, w), y1 = Math.min(y0 + 32, h);
    let x = x0, y = y0;
    for (let r = 0; r < runs; r++) {
      const cnt = dv.getUint16(i, true), R = p[i + 2], G = p[i + 3], B = p[i + 4];
      i += 5;
      for (let k = 0; k < cnt && y < h; k++) {
        const o = (y * w + x) * 4;
        d[o] = R; d[o + 1] = G; d[o + 2] = B; d[o + 3] = 255;
        if (++x >= x1) { x = x0; y++; }
      }
    }
    ctx.putImageData(img, 0, 0, x0, y0, x1 - x0, y1 - y0);
  }
}

async function startStream() {
  if (running) return;
  running = true;
  let failures = 0;
  while (running) {
    const [w, h] = wantedSize();
    aborter = new AbortController();
    try {
      const r = await fetch("/api/stream?w=" + w + "&h=" + h, { credentials: "same-origin", signal: aborter.signal });
      if (r.status === 401) { showLogin("Your session has ended. Log in again."); return; }
      if (!r.ok) throw new Error("stream " + r.status);
      failures = 0;
      say($("msg"), "");
      const rd = r.body.getReader();
      let buf = new Uint8Array(0);
      for (;;) {
        const { done, value } = await rd.read();
        if (done) break;
        const nb = new Uint8Array(buf.length + value.length); nb.set(buf); nb.set(value, buf.length); buf = nb;
        let off = 0;
        while (buf.length - off >= 5) {
          const len = new DataView(buf.buffer, buf.byteOffset + off + 1, 4).getUint32(0, true);
          if (buf.length - off - 5 < len) break;
          const kind = buf[off], body = buf.subarray(off + 5, off + 5 + len);
          off += 5 + len;
          if (kind === 1) drawTiles(body);
          else if (kind === 3) { running = false; showLogin("The session ended (" + new TextDecoder().decode(body) + ")."); return; }
        }
        buf = buf.subarray(off);
      }
    } catch (e) { if (!running) return; }
    if (!running) return;
    failures++;
    await new Promise(res => setTimeout(res, Math.min(5000, 500 * failures)));   // the phone slept or the network dropped: try again
    const m = await api("/api/me").catch(() => null);
    if (m && m.status === 401) { showLogin("Your session has ended. Log in again."); return; }
  }
}

// ---- keys ----

const NAMED = { Enter: "enter", Escape: "esc", Backspace: "backspace", Tab: "tab", ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  Home: "home", End: "end", PageUp: "pgup", PageDown: "pgdn", Delete: "delete" };
for (let i = 1; i <= 12; i++) NAMED["F" + i] = "f" + i;

function send(line) { queue.push(line); if (!sending) flush(); }
async function flush() {
  sending = true;
  while (queue.length) {
    const body = queue.join("\n") + "\n"; queue = [];
    try { await api("/api/key", { method: "POST", headers: { "Content-Type": "text/plain" }, body }); } catch (e) { /* the stream will notice */ }
  }
  sending = false;
}

function mods(ctrl, alt, shift) { return (ctrl ? "ctrl-" : "") + (alt ? "alt-" : "") + (shift ? "shift-" : ""); }
function useSticky() { const r = [stickyCtrl, stickyAlt]; stickyCtrl = stickyAlt = false; $("mctrl").classList.remove("on"); $("malt").classList.remove("on"); return r; }

function typeChar(ch) {
  const [c, a] = useSticky();
  if (c || a) send("k " + mods(c, a, false) + ch.toLowerCase());
  else send("t " + ch);
}
function pressNamed(name, ctrl, alt, shift) { const [c, a] = useSticky(); send("k " + mods(ctrl || c, alt || a, shift) + name); }

document.addEventListener("keydown", ev => {
  if (!running || $("screen").style.display === "none" || $("overlay").style.display === "flex") return;
  if (ev.target && ev.target.id === "kb" && ev.isComposing) return;
  if (["Control", "Alt", "Shift", "Meta", "AltGraph", "CapsLock", "Dead"].includes(ev.key)) return;
  if (ev.metaKey) return;
  let name = NAMED[ev.key];
  if (name) { ev.preventDefault(); pressNamed(name, ev.ctrlKey, ev.altKey, ev.shiftKey && name !== "tab" ? false : ev.shiftKey); return; }
  if (ev.key === "Unidentified" || ev.key.length !== 1) return;
  ev.preventDefault();
  if (ev.ctrlKey || ev.altKey) {
    // shortcuts name the key, not the character it makes on this keyboard
    let ch = ev.key.toLowerCase();
    if (/^Key[A-Z]$/.test(ev.code)) ch = ev.code[3].toLowerCase(); else if (/^Digit[0-9]$/.test(ev.code)) ch = ev.code[5];
    send("k " + mods(ev.ctrlKey, ev.altKey, false) + ch);
    useSticky();
  } else typeChar(ev.key);
});

// the phone's own keyboard
const kb = $("kb");
kb.addEventListener("input", ev => {
  const t = ev.inputType;
  if (t === "deleteContentBackward") pressNamed("backspace");
  else if (t === "insertLineBreak" || t === "insertParagraph") pressNamed("enter");
  else if (ev.data) for (const ch of ev.data) typeChar(ch);
  kb.value = "";
});
kb.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); pressNamed("enter"); } else if (ev.key === "Backspace" && kb.value === "") { ev.preventDefault(); pressNamed("backspace"); } });
$("cv").addEventListener("click", () => { if (matchMedia("(pointer: coarse)").matches) kb.focus(); else $("cv").focus(); });
$("mkbd").addEventListener("click", () => kb.focus());
document.querySelectorAll("#bar button[data-k]").forEach(b => b.addEventListener("click", ev => { ev.preventDefault(); pressNamed(b.dataset.k); }));
$("mctrl").addEventListener("click", () => { stickyCtrl = !stickyCtrl; $("mctrl").classList.toggle("on", stickyCtrl); });
$("malt").addEventListener("click", () => { stickyAlt = !stickyAlt; $("malt").classList.toggle("on", stickyAlt); });
$("mout").addEventListener("click", async () => { await api("/api/logout", { method: "POST" }).catch(() => null); showLogin("Logged out."); });

// ---- files ----

function closeOverlay() { $("overlay").style.display = "none"; $("cv").focus(); }
function openFiles() {
  const dir = (me && me.home ? me.home : "/") + "/";
  $("ob").innerHTML = '<h2>Files</h2>' +
    '<label>Send files to this folder</label><div class="row"><input type="text" id="fdir" spellcheck="false" autocapitalize="none"></div>' +
    '<div class="row"><input type="file" id="ffile" multiple></div><div class="row"><button id="fsend">Send</button></div><progress id="fprog" value="0" max="1" hidden></progress>' +
    '<label>Get a file from the server (full path)</label><div class="row"><input type="text" id="fget" spellcheck="false" autocapitalize="none" placeholder="/home/you/file.txt"><button id="fgo">Get</button></div>' +
    '<div id="msg"></div><div class="row"><button id="fclose">Close</button></div>';
  $("fdir").value = dir;
  $("overlay").style.display = "flex";
  $("fclose").onclick = closeOverlay;
  $("fsend").onclick = () => sendFiles([...$("ffile").files]);
  $("fgo").onclick = () => {
    const p = $("fget").value.trim();
    if (!p.startsWith("/")) { say($("msg"), "Type the full path, starting with /"); return; }
    const a = document.createElement("a"); a.href = "/api/download?path=" + encodeURIComponent(p); document.body.appendChild(a); a.click(); a.remove();
    say($("msg"), "Download started.");
  };
}
$("mfiles").addEventListener("click", openFiles);

function uploadOne(file, dir, onProgress) {
  return new Promise(res => {
    const x = new XMLHttpRequest();
    x.open("POST", "/api/upload?dir=" + encodeURIComponent(dir) + "&name=" + encodeURIComponent(file.name));
    x.setRequestHeader("X-Exec85", "1");
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch (e) { } res(j.ok ? "Sent " + j.name : (j.error || "Failed") + " (" + file.name + ")"); };
    x.onerror = () => res("Failed (" + file.name + ")");
    x.send(file);
  });
}
async function sendFiles(files) {
  if (!files.length) return;
  if (!$("ob").firstChild || $("overlay").style.display !== "flex") openFiles();
  const dir = ($("fdir") ? $("fdir").value.trim() : "") || (me && me.home ? me.home : "/");
  const prog = $("fprog"); prog.hidden = false;
  const out = [];
  for (const f of files) { prog.value = 0; out.push(await uploadOne(f, dir, v => { prog.value = v; })); say($("msg"), out.join("\n")); }
  prog.hidden = true;
}
let dragDepth = 0;
addEventListener("dragenter", ev => { if (running) { ev.preventDefault(); dragDepth++; $("drop").style.display = "flex"; } });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("drop").style.display = "none"; } });
addEventListener("dragover", ev => ev.preventDefault());
addEventListener("drop", ev => { ev.preventDefault(); dragDepth = 0; $("drop").style.display = "none"; if (running && ev.dataTransfer && ev.dataTransfer.files.length) sendFiles([...ev.dataTransfer.files]); });

// already logged in (the page was reloaded)?
api("/api/me").then(async r => { if (r.ok) { me = await r.json(); showScreen(); } }).catch(() => null);
</script>
</body>
</html>
