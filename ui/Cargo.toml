[package]
name = "exec85"
version = "0.0.1"
edition = "2021"
description = "Exec85 interface: draws straight to the screen (DRM/framebuffer), no X11/Wayland"
license = "MIT"

# No external crates on purpose: smaller binary, nothing to download, fewer surprises.
[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
