name: build-and-boot-test
on:
  push:
    branches: ['**']      # branches only; version tags are handled by release.yml
  workflow_dispatch:
  workflow_call:          # lets release.yml reuse this whole pipeline

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path ui/Cargo.toml

  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build ISO inside Alpine
        run: |
          mkdir -p out
          docker run --rm -v "$PWD":/src -v "$PWD/out":/out alpine:3.22 sh /src/scripts/build-image.sh
      - uses: actions/upload-artifact@v4
        with:
          name: exec85-iso
          path: |
            out/exec85.iso
            out/exec85-testing.iso
            out/sizes.txt

  boot-test:
    needs: build-iso
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: exec85-iso, path: out }
      - name: Boot in QEMU (${{ matrix.firmware }}), inside an Alpine container
        run: |
          KVM=""
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; KVM="--device /dev/kvm"; echo "KVM available"; else echo "no KVM: software emulation (TCG)"; fi
          mkdir -p results
          docker run --rm $KVM -v "$PWD":/src -w /src alpine:3.22 sh -c \
            "apk add --no-cache qemu-system-x86_64 qemu-hw-display-virtio-vga ovmf python3 >/dev/null && python3 scripts/boot-test.py out/exec85.iso ${{ matrix.firmware }} results && python3 scripts/boot-test.py out/exec85-testing.iso ${{ matrix.firmware }} results-testing --testing"
      - name: Summary
        if: always()
        run: |
          { echo "### Boot test: ${{ matrix.firmware }}"; echo '```json'; cat results/result-${{ matrix.firmware }}.json 2>/dev/null; echo '```'; cat out/sizes.txt; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-${{ matrix.firmware }}
          path: |
            results/
            results-testing/
            !results/disk-*.img
