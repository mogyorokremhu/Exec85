name: release
# Push a tag like v0.1.0 (or press Run workflow and type the tag) to publish a release: it builds the ISO, boot-tests it
# (BIOS + UEFI) and only then attaches the ISO and checksum to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:      # "Run workflow" button: creates the tag for you
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/build.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: exec85-iso, path: out }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd out
          mv exec85.iso "exec85-${TAG}.iso"
          sha256sum "exec85-${TAG}.iso" > SHA256SUMS
          cat sizes.txt SHA256SUMS
          cat > notes.md <<NOTES
          **Early alpha. This is a boot test image, not an installable OS yet.**

          It boots (BIOS and UEFI) to a blank Exec85 screen. There is no installer,
          login, file browser or apps yet; those come in later milestones.

          ### Try it in QEMU
          \`\`\`
          qemu-system-x86_64 -m 512 -smp 2 -cdrom exec85-${TAG}.iso -boot d -vga std
          \`\`\`
          Add \`-accel tcg\` if hardware virtualization is off, or \`-accel whpx\` / \`-accel kvm\` if it is on.
          Check the download with \`sha256sum -c SHA256SUMS\`.

          The ISO was boot-tested in QEMU (BIOS and UEFI) by CI before this release was created.
          Boot and memory numbers are in docs/MEASURING.md.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG" "exec85-${TAG}.iso" SHA256SUMS \
            --repo "${{ github.repository }}" --title "Exec85 ${TAG} (alpha)" \
            --target "${{ github.sha }}" --prerelease --notes-file notes.md
