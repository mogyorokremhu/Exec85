name: release
# Push a tag like v0.1.0 (or press Run workflow and type the tag) to publish a release: it builds the ISO, boot-tests it
# (BIOS + UEFI) and only then attaches the ISO and checksum to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:      # "Run workflow" button: creates the tag for you
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/build.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: exec85-iso, path: out }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd out
          mv exec85.iso "exec85-${TAG}.iso"
          sha256sum "exec85-${TAG}.iso" > SHA256SUMS
          cat sizes.txt SHA256SUMS
          # Release text comes from docs/releases/<tag>.md when that file exists (written by a person);
          # otherwise a short generic text.
          if [ -f "$GITHUB_WORKSPACE/docs/releases/${TAG}.md" ]; then
            cp "$GITHUB_WORKSPACE/docs/releases/${TAG}.md" notes.md
          else
            printf '%s\n' "**Early alpha release ${TAG}.** See the repository README and docs/ for what works." \
              "Check the download with \`sha256sum -c SHA256SUMS\`." > notes.md
          fi
          gh release create "$TAG" "exec85-${TAG}.iso" SHA256SUMS \
            --repo "${{ github.repository }}" --title "Exec85 ${TAG} (alpha)" \
            --target "${{ github.sha }}" --prerelease --notes-file notes.md
