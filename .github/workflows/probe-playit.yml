name: probe-playit
# A short experiment (about a minute): what does the playit agent look like, and does it run on Alpine's musl C library?
# It runs only when this file is pushed. It is removed again once the findings are used.
on:
  push:
    paths: ['.github/workflows/probe-playit.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Releases and files
        run: |
          gh api "repos/playit-cloud/playit-agent/releases?per_page=12" --jq '.[]|[.tag_name,.name,.prerelease,(.assets|length)]|@tsv'
          for tag in $(gh api "repos/playit-cloud/playit-agent/releases?per_page=12" --jq '.[]|select(.prerelease==false)|.tag_name' | head -3); do echo "=== $tag"; gh api "repos/playit-cloud/playit-agent/releases/tags/$tag" --jq '.assets[]|[.name,.size,(.digest // "-")]|@tsv' | grep -iE "linux|SHA|sum" ; done
      - name: Download the 64-bit Linux files
        run: |
          mkdir -p p && cd p
          for tag in $(gh api "repos/playit-cloud/playit-agent/releases?per_page=12" --jq '.[]|select(.prerelease==false)|.tag_name' | head -2); do
            mkdir -p $tag
            for n in $(gh api "repos/playit-cloud/playit-agent/releases/tags/$tag" --jq '.assets[].name' | grep -iE "linux" | grep -iE "amd64|x86_64" | grep -viE "\.(deb|rpm|apk|tar|zip)$|gui"); do
              curl -fsSL -o $tag/$n https://github.com/playit-cloud/playit-agent/releases/download/$tag/$n && chmod +x $tag/$n
            done
          done
          ls -lR; file */* || true
      - name: The two programs together (v2.0.2), on Alpine
        run: |
          docker run --rm -v "$PWD/p/v2.0.2":/p -e HOME=/tmp/h alpine:3.22 sh -c '
            cd /tmp && cp /p/playit-linux-amd64 playitd && cp /p/playit-cli-linux-amd64 playit && chmod +x playitd playit
            ./playitd --socket-path /tmp/p.sock --secret-path /tmp/p.toml --log-path /tmp/d.log > /tmp/d.out 2>&1 &
            sleep 3
            echo "--- claim --help"; ./playit --socket-path /tmp/p.sock claim --help 2>&1 | head -30
            echo "--- setup --help"; ./playit --socket-path /tmp/p.sock setup --help 2>&1 | head -30
            echo "--- status"; ./playit --socket-path /tmp/p.sock status 2>&1 | head -20
            echo "--- secret-path"; ./playit --socket-path /tmp/p.sock secret-path 2>&1 | head
            echo "--- claim (no terminal), 20 s"; timeout 20 ./playit --socket-path /tmp/p.sock claim 2>&1 | head -40
            echo "--- setup (no terminal), 20 s"; timeout 20 ./playit --socket-path /tmp/p.sock setup 2>&1 | head -40
            echo "--- daemon output"; cat /tmp/d.out | head -30; echo "--- daemon log"; cat /tmp/d.log 2>/dev/null | head -30
          ' || true
      - name: The older single program (v1.2.0), on Alpine
        run: |
          mkdir -p q && curl -fsSL -o q/playit https://github.com/playit-cloud/playit-agent/releases/download/v1.2.0/playit-linux-amd64 && chmod +x q/playit
          docker run --rm -v "$PWD/q":/q -e HOME=/tmp/h alpine:3.22 sh -c 'echo "--- help"; /q/playit --help 2>&1 | head -40; echo "--- first start, 20 s, no terminal"; timeout 20 /q/playit 2>&1 | head -30; ls -laR /tmp/h 2>/dev/null | head' || true
